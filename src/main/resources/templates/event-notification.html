<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvel Événement</title>
</head>
<body>
    <h1>Nouveau événement : <span th:text="${event.title}"></span></h1>
    
    <p>Vous avez été invité(e) à un nouvel événement.</p>
    
    <div>
        <h3>Détails de l'événement :</h3>
        <ul>
            <li>Date de début : <span th:text="${#temporals.format(event.start, 'dd/MM/yyyy HH:mm')}"></span></li>
            <li>Date de fin : <span th:text="${#temporals.format(event.end, 'dd/MM/yyyy HH:mm')}"></span></li>
            <li>Description : <span th:text="${event.description}"></span></li>
            <li>Type : <span th:text="${event.type}"></span></li>
            <li>Priorité : <span th:text="${event.priority}"></span></li>
        </ul>
    </div>
    
    <p>Merci de votre participation !</p>
</body>
</html>
