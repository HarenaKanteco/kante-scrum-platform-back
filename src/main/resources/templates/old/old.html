<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Design Email</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
        sans-serif;
    }

    main {
      width: 100%;
      min-height: 100vh;
      background: #f1f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-block: 3rem;
    }

    .container {
      display: flex;
      align-items: center;
      flex-direction: column;
      padding-left: 10px;
      padding-right: 10px;
    }

    .content {
      max-width: 750px;
      background: white;
      border-top: 6px solid #39aec1;
      padding: 2.5rem;
    }

    h1 {
      font-size: 24px;
      color: #707070;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    p {
      font-size: 18px;
      margin-bottom: 1rem;
      line-height: normal;
      color: #707070;
    }

    .text {
      margin-bottom: 2.5rem;
    }

    .btn {
      text-align: center;
    }

    .btn > a {
      background: #39aec1;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-size: 18px;
      transition: background 0.3s;
      display: inline-block;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .btn > a:hover {
      background: #3194a3;
    }

    .social-network {
      margin-top: 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .footer {
      text-align: center;
    }

    .footer > a {
      color: #39aec1;
    }
  </style>
