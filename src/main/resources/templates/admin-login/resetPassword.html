<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Réinitialiser le mot de passe</title>
    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.min.css">
    <!-- Custom styles for this template-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- Outer Row -->
    <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-12 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image">
                            <img class="img-fluid" th:src="@{/img/kanteCo.png}" alt="Kante Co logo">
                        </div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Réinitialiser le mot de passe</h1>
                                </div>
                                <form class="user" th:action="@{/admin/reset-password}" method="post">
                                    <input type="hidden" name="token" th:value="${token}" />
                                    <div class="form-group">
                                        <div class="input-group">
                                            <input type="password" class="form-control form-control-user" placeholder="Nouveau mot de passe" name="password" id="password" required minlength="4" oninvalid="this.setCustomValidity('Veuillez entrer un mot de passe(4 caractères min) .')" oninput="this.setCustomValidity('')">
                                            <div class="input-group-append">
                                                <span class="input-group-text" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')">
                                                    <i id="togglePasswordIcon" class="bi bi-eye-fill"></i>
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="input-group">
                                            <input type="password" class="form-control form-control-user" placeholder="Confirmer le mot de passe" name="confirmPassword" id="confirmPassword" required minlength="4" oninvalid="this.setCustomValidity('Veuillez confirmer votre mot de passe.')" oninput="this.setCustomValidity('')">
                                            <div class="input-group-append">
                                                <span class="input-group-text" onclick="togglePasswordVisibility('confirmPassword', 'toggleConfirmPasswordIcon')">
                                                    <i id="toggleConfirmPasswordIcon" class="bi bi-eye-fill"></i>
                                                </span>
                                            </div>
                                        </div>
                                        <div id="passwordError" class="mt-3" style="color: red; display: none; font-size: 0.8em;">Les mots de passe ne correspondent pas.</div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-user btn-block">Réinitialiser le mot de passe</button>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" th:href="@{/admin/login}">Retour à la connexion</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap core JavaScript-->
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<!-- Core plugin JavaScript-->
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<!-- Custom scripts for all pages-->
<script th:src="@{/js/sb-admin-2.min.js}"></script>
<script>
    document.getElementById('confirmPassword').addEventListener('input', function() {
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var errorDiv = document.getElementById('passwordError');
        
        if (password !== confirmPassword) {
            errorDiv.style.display = 'block';
        } else {
            errorDiv.style.display = 'none';
        }
    });

    function togglePasswordVisibility(passwordFieldId, iconId) {
        var passwordField = document.getElementById(passwordFieldId);
        var icon = document.getElementById(iconId);
        if (passwordField.type === "password") {
            passwordField.type = "text";
            icon.classList.remove('bi-eye-fill');
            icon.classList.add('bi-eye-slash');
        } else {
            passwordField.type = "password";
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye-fill');
        }
    }
</script>
</body>
</html>
